; vtmb-fastfs 1.0: faster level transitions for Vampire: The Masquerade - Bloodlines
; (Unofficial Patch). See vtmb-fastfs-README.txt in the game folder.
; Delete vtmb-fastfs.vtm (or set Enable = 0) to turn it off.

[Main]
Enable = 1              ; 0 = plugin does nothing
Index At Startup = 1    ; 1 = index the game folder at launch, so missing loose files
                        ;     are answered instantly from the first load
Cache Searches = 1      ; 1 = remember wildcard file searches (e.g. footstep sounds) instead
                        ;     of scanning all VPK archives every transition; saved to
                        ;     vtmb-fastfs-find.cache and reused while the game files are unchanged
Fast Connect = 1        ; 1 = while a level is connecting: no fps_max frame cap, and no
                        ;     loading-screen redraws (which wait for V-Sync) for the fraction
                        ;     of a second the level data streams in; gameplay keeps your fps_max
Fast Parse = 1          ; 1 = fix the game DLL's atof(), which rescanned the whole entity text
                        ;     for every number parsed (results are bit-identical)
Fast Console = 1        ; 1 = fix the console's scroll-bar update, which rescanned the whole
                        ;     console history once per line for every line printed (level
                        ;     builds took up to 3x longer once the console filled up)
Fast Model Lookup = 1   ; 1 = cache model lookups of the modelloader-fix plugin, which
                        ;     re-normalised every loaded model's name on every lookup
Fast Inflate = 1        ; 1 = decompress textures with libdeflate instead of the game's 2004
                        ;     zlib (several times faster; falls back to zlib for anything unusual)
Fast Bone Link = 1      ; 1 = link model bones by hash lookup instead of comparing every bone
                        ;     name with every other (same result)
Fast Anim Lookup = 1    ; 1 = find animation sequences/activities by hash lookup instead of
                        ;     comparing every sequence name of the model (same result)
Fast Symbols = 1        ; 1 = cache the filesystem's string-to-symbol lookups (searched a tree
                        ;     of all known path strings for every file lookup)
Prefetch Textures = 1   ; 1 = decompress a level's textures ahead of time on spare CPU cores
                        ;     (learned on the first visit; list kept in vtmb-fastfs-tex.cache)
Skip Load Fade-In = 1   ; 1 = the loading screen disappears at once instead of fading out over
                        ;     3 s, and no extra fade from black on "start dark" maps
Logging = 0             ; 1 = write vtmb-fastfs.log with statistics to the game folder

; Diagnostics - leave off for normal play (the profiler slows the game down):
Profile Loads = 0       ; 1 = sample the game for 20 s after each map load -> vtmb-profile-N.bin
Log Console = 0         ; 1 = write all engine messages with timestamps -> vtmb-console.log
Watch Loads = 0         ; 1 = log engine connection-state changes during map loads (needs Log Console = 1)
Probe Fades = 0         ; 1 = log full-screen fades to vtmb-console.log (needs Log Console = 1)
